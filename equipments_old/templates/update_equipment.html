{% extends "master.html" %}

{% block title %}
 - Alterar equipamento
 {% endblock title %}

{% block content %}

<div class="card mt-2">
    <div class="card-header">
        Alterar equipamento
    </div>

    <div class="card-body">
        
        <form action="updaterecord/{{ myequipment.id }}" method="post">
            {% csrf_token %}

            Name:<br>
            <input type="text" name="name" value="{{ myequipment.name }}">
            <br><br>
            Register Number:<br>
            <input type="number" name="register_number" value="{{ myequipment.register_number }}">
            <br><br>
            Register Date:<br>
            <input type="date" name="register_date" value="{{ myequipment.register_date|date:'Y-m-d' }}">
            <br><br>
            <input type="submit" value="Submit">
        </form>

        <p><a href="/equipments/">Voltar</a></p>

    </div>

</div>

{% endblock %}
